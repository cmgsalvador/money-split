<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f7"><title>FACCET Mass Collection Summary</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f7;color:#111}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:22px 16px 40px}h1{font-size:30px;margin:8px 0 4px}.sub{color:#666;margin:0 0 20px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 3px 18px #0000000d}.heading{font-size:13px;color:#666;font-weight:700;margin-bottom:10px}.row{display:grid;grid-template-columns:65px 1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.den{font-size:19px;font-weight:700}input{width:100%;font-size:20px;padding:12px;border:1px solid #d5d5da;border-radius:12px;text-align:center;background:#fafafa}.amount{text-align:right;font-size:18px;font-weight:600}.collector{display:flex;gap:8px;margin:8px 0}.collector input{text-align:left}.smallbtn{width:auto;padding:10px 13px;border:0;border-radius:11px;font-size:15px;font-weight:650;background:#e5e5ea;color:#111}.twocol{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center}.total{text-align:center;font-size:36px;font-weight:800;margin:5px 0 18px}.label{text-align:center;color:#666;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#f5f5f7;border-radius:16px;padding:16px;text-align:center}.box span{font-size:13px;color:#666}.box b{display:block;font-size:23px;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:700}#export{background:#111;color:#fff}#reset{background:#e5e5ea;color:#111}.coinNote{font-size:12px;color:#777;margin-top:8px}</style></head><body><main class="wrap"><h1>FACCET Mass<br>Collection Summary</h1><p class="sub">Enter collectors, bill counts, checks, and coins.</p><section class="card"><div class="heading">COLLECTORS</div><div id="collectorList"><div class="collector"><input type="text" class="collectorName" placeholder="Collector name"></div></div><button class="smallbtn" type="button" onclick="addCollector()">+ Add Collector</button></section><section class="card"><div class="heading">CASH</div><div id="cashRows"></div></section><section class="card"><div class="twocol"><div class="den">Checks</div><input type="number" min="0" step=".01" id="checks" placeholder="0.00" oninput="calculate()"></div><div class="twocol" style="margin-top:12px"><div class="den">Coins</div><input type="number" min="0" step=".01" id="coins" placeholder="0.00" oninput="calculate()"></div><div class="coinNote">Coins are shown in the overall money total but excluded from the 30% / 70% split.</div></section><section class="card"><div class="label">TOTAL MONEY</div><div class="total" id="grandTotal">$0.00</div><div class="label">SPLIT BASE (cash + checks)</div><div style="text-align:center;font-weight:700;font-size:20px;margin:4px 0 14px" id="splitBase">$0.00</div><div class="split"><div class="box"><span>FACCET • 30%</span><b id="share30">$0.00</b></div><div class="box"><span>S.H. • 70%</span><b id="share70">$0.00</b></div></div></section><div class="actions"><button id="export" onclick="exportWord()">Export Word</button><button id="reset" onclick="resetForm()">Reset</button></div></main><script>
var ds=[1,5,10,20,50,100],cashRows=document.getElementById("cashRows");ds.forEach(function(d){cashRows.insertAdjacentHTML("beforeend",'<div class="row"><div class="den">$'+d+'</div><input type="number" min="0" step="1" id="n'+d+'" placeholder="0" oninput="calculate()"><div class="amount" id="a'+d+'">$0.00</div></div>')});
function nv(id){var n=parseFloat(document.getElementById(id).value);return isNaN(n)||n<0?0:n}function usd(n){return "$"+n.toFixed(2)}
function calculate(){var cash=0;ds.forEach(function(d){var q=Math.floor(nv("n"+d)),a=q*d;document.getElementById("a"+d).textContent=usd(a);cash+=a});var base=cash+nv("checks"),all=base+nv("coins");document.getElementById("grandTotal").textContent=usd(all);document.getElementById("splitBase").textContent=usd(base);document.getElementById("share30").textContent=usd(base*.3);document.getElementById("share70").textContent=usd(base*.7);return {cash:cash,base:base,all:all}}
function addCollector(){var w=document.createElement("div");w.className="collector";w.innerHTML='<input type="text" class="collectorName" placeholder="Collector name"><button type="button" class="smallbtn">Remove</button>';w.querySelector("button").onclick=function(){w.remove()};document.getElementById("collectorList").appendChild(w)}
function resetForm(){document.querySelectorAll("input").forEach(function(x){x.value=""});var l=document.getElementById("collectorList");while(l.children.length>1)l.removeChild(l.lastChild);calculate()}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function exportWord(){var t=calculate(),names=[];document.querySelectorAll(".collectorName").forEach(function(x){if(x.value.trim())names.push(x.value.trim())});var now=new Date(),billRows="";ds.forEach(function(d){var q=Math.floor(nv("n"+d));billRows+="<tr><td>$"+d+"</td><td>"+q+"</td><td>"+usd(q*d)+"</td></tr>"});var html='<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;color:#222;margin:42px}h1{text-align:center;font-size:24pt;margin-bottom:4px}p.meta{text-align:center;color:#666;margin-top:0}.info{margin:28px 0 18px}.info p{margin:7px 0}table{width:100%;border-collapse:collapse;margin:14px 0 24px}th{background:#eee;text-align:left}th,td{border:1px solid #bbb;padding:9px}.num{text-align:right}.summary{width:65%;margin-left:auto}.summary td:first-child{font-weight:bold}.shares{margin-top:28px;border:2px solid #444;padding:18px}.shares h2{text-align:center;margin-top:0}.shares table{margin-bottom:0}footer{margin-top:36px;border-top:1px solid #aaa;padding-top:12px;color:#666;font-size:9pt}</style></head><body><h1>FACCET Mass Collection Summary</h1><p class="meta">'+esc(now.toLocaleString())+'</p><div class="info"><p><b>Collector(s):</b> '+esc(names.join(", ")||"Not entered")+'</p></div><h2>Cash Collection</h2><table><tr><th>Denomination</th><th>Count</th><th>Amount</th></tr>'+billRows+'</table><table class="summary"><tr><td>Cash Total</td><td class="num">'+usd(t.cash)+'</td></tr><tr><td>Checks</td><td class="num">'+usd(nv("checks"))+'</td></tr><tr><td>Coins</td><td class="num">'+usd(nv("coins"))+'</td></tr><tr><td>Total Money</td><td class="num"><b>'+usd(t.all)+'</b></td></tr><tr><td>Split Base (Cash + Checks)</td><td class="num">'+usd(t.base)+'</td></tr></table><div class="shares"><h2>Collection Distribution</h2><table><tr><th>Recipient</th><th>Share</th><th>Amount</th></tr><tr><td>FACCET</td><td>30%</td><td class="num"><b>'+usd(t.base*.3)+'</b></td></tr><tr><td>S.H.</td><td>70%</td><td class="num"><b>'+usd(t.base*.7)+'</b></td></tr></table></div><footer>Coins are included in Total Money but excluded from the 30% / 70% distribution.</footer></body></html>';var blob=new Blob(["\ufeff",html],{type:"application/msword"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="FACCET-Mass-Collection-Summary-"+now.toISOString().slice(0,10)+".doc";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
calculate();</script></body></html>

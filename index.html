<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f7"><title>FACCET Mass Collection Summary</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f7;color:#111}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:22px 16px 40px}h1{font-size:30px;margin:8px 0 4px}.sub{color:#666;margin:0 0 20px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 3px 18px #0000000d}.heading{font-size:13px;color:#666;font-weight:700;margin-bottom:10px}.row{display:grid;grid-template-columns:65px 1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.den{font-size:19px;font-weight:700}input{width:100%;font-size:20px;padding:12px;border:1px solid #d5d5da;border-radius:12px;text-align:center;background:#fafafa}.amount{text-align:right;font-size:18px;font-weight:600}.collector{display:flex;gap:8px;margin:8px 0}.collector input{text-align:left}.smallbtn{width:auto;padding:10px 13px;border:0;border-radius:11px;font-size:15px;font-weight:650;background:#e5e5ea;color:#111}.twocol{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center}.total{text-align:center;font-size:36px;font-weight:800;margin:5px 0 18px}.label{text-align:center;color:#666;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#f5f5f7;border-radius:16px;padding:16px;text-align:center}.box span{font-size:13px;color:#666}.box b{display:block;font-size:23px;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.actions button{padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:700}#export{background:#111;color:#fff}#exportJpg{background:#111;color:#fff}#reset{background:#e5e5ea;color:#111}.coinNote{font-size:12px;color:#777;margin-top:8px}</style></head><body><main class="wrap"><h1>FACCET Mass<br>Collection Summary</h1><p class="sub">Enter collectors, bill counts, checks, and coins.</p><section class="card"><div class="heading">COLLECTORS</div><div id="collectorList"><div class="collector"><input type="text" class="collectorName" placeholder="Collector name"></div></div><button class="smallbtn" type="button" onclick="addCollector()">+ Add Collector</button></section><section class="card"><div class="heading">CASH</div><div id="cashRows"></div></section><section class="card"><div class="twocol"><div class="den">Checks</div><input type="number" min="0" step=".01" id="checks" placeholder="0.00" oninput="calculate()"></div><div class="twocol" style="margin-top:12px"><div class="den">Coins</div><input type="number" min="0" step=".01" id="coins" placeholder="0.00" oninput="calculate()"></div></section><section class="card"><div class="label">TOTAL MONEY</div><div class="total" id="grandTotal">$0.00</div><div class="split"><div class="box"><span>FACCET • 30%</span><b id="share30">$0.00</b></div><div class="box"><span>S.H. • 70%</span><b id="share70">$0.00</b></div></div></section><div class="actions"><button id="export" onclick="exportWord()">Export Word</button><button id="exportJpg" onclick="exportJPG()">Export JPG</button><button id="reset" onclick="resetForm()">Reset</button></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
var ds=[1,5,10,20,50,100],cashRows=document.getElementById("cashRows");ds.forEach(function(d){cashRows.insertAdjacentHTML("beforeend",'<div class="row"><div class="den">$'+d+'</div><input type="number" min="0" step="1" id="n'+d+'" placeholder="0" oninput="calculate()"><div class="amount" id="a'+d+'">$0.00</div></div>')});
function nv(id){var n=parseFloat(document.getElementById(id).value);return isNaN(n)||n<0?0:n}function usd(n){return "$"+n.toFixed(2)}
function calculate(){var cash=0;ds.forEach(function(d){var q=Math.floor(nv("n"+d)),a=q*d;document.getElementById("a"+d).textContent=usd(a);cash+=a});var base=cash+nv("checks"),all=base+nv("coins");document.getElementById("grandTotal").textContent=usd(all);var sb=document.getElementById("splitBase");if(sb)sb.textContent=usd(base);document.getElementById("share30").textContent=usd(base*.3);document.getElementById("share70").textContent=usd(base*.7);return {cash:cash,base:base,all:all}}
function addCollector(){var w=document.createElement("div");w.className="collector";w.innerHTML='<input type="text" class="collectorName" placeholder="Collector name"><button type="button" class="smallbtn">Remove</button>';w.querySelector("button").onclick=function(){w.remove()};document.getElementById("collectorList").appendChild(w)}
function resetForm(){document.querySelectorAll("input").forEach(function(x){x.value=""});var l=document.getElementById("collectorList");while(l.children.length>1)l.removeChild(l.lastChild);calculate()}
function xmlEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function wp(text,bold,size,align){return '<w:p><w:pPr>'+(align?'<w:jc w:val="'+align+'"/>':'')+'</w:pPr><w:r><w:rPr>'+(bold?'<w:b/>':'')+(size?'<w:sz w:val="'+size+'"/>':'')+'</w:rPr><w:t xml:space="preserve">'+xmlEsc(text)+'</w:t></w:r></w:p>'}
function cell(text,bold,width){return '<w:tc><w:tcPr>'+(width?'<w:tcW w:w="'+width+'" w:type="dxa"/>':'')+'<w:shd w:fill="'+(bold?'EDEDED':'FFFFFF')+'"/></w:tcPr>'+wp(text,bold,22)+'</w:tc>'}
function row(a,b,c,head){return '<w:tr>'+cell(a,head,3000)+cell(b,head,1800)+cell(c,head,2600)+'</w:tr>'}
async function exportWord(){if(typeof JSZip==="undefined"){alert("Word export library did not load. Please check your internet connection and try again.");return}var t=calculate(),names=[];document.querySelectorAll(".collectorName").forEach(function(x){if(x.value.trim())names.push(x.value.trim())});var now=new Date(),cashRowsXml="";ds.forEach(function(d){var q=Math.floor(nv("n"+d));cashRowsXml+=row("$"+d,String(q),usd(q*d),false)});var body=wp("FACCET Mass Collection Summary",true,36,"center")+wp(now.toLocaleString(),false,20,"center")+wp("",false,20)+wp("Collector(s): "+(names.join(", ")||"Not entered"),true,22)+wp("",false,20)+wp("Cash Collection",true,28)+
'<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="6"/><w:left w:val="single" w:sz="6"/><w:bottom w:val="single" w:sz="6"/><w:right w:val="single" w:sz="6"/><w:insideH w:val="single" w:sz="4"/><w:insideV w:val="single" w:sz="4"/></w:tblBorders></w:tblPr>'+row("Denomination","Count","Amount",true)+cashRowsXml+'</w:tbl>'+
wp("",false,20)+wp("Collection Summary",true,28)+
'<w:tbl><w:tblPr><w:tblBorders><w:top w:val="single" w:sz="6"/><w:left w:val="single" w:sz="6"/><w:bottom w:val="single" w:sz="6"/><w:right w:val="single" w:sz="6"/><w:insideH w:val="single" w:sz="4"/><w:insideV w:val="single" w:sz="4"/></w:tblBorders></w:tblPr>'+
row("Cash Total","",usd(t.cash),false)+row("Checks","",usd(nv("checks")),false)+row("Coins","",usd(nv("coins")),false)+row("TOTAL MONEY","",usd(t.all),true)+'</w:tbl>'+
wp("",false,20)+wp("Collection Distribution",true,28,"center")+
'<w:tbl><w:tblPr><w:tblBorders><w:top w:val="single" w:sz="10"/><w:left w:val="single" w:sz="10"/><w:bottom w:val="single" w:sz="10"/><w:right w:val="single" w:sz="10"/><w:insideH w:val="single" w:sz="5"/><w:insideV w:val="single" w:sz="5"/></w:tblBorders></w:tblPr>'+row("Recipient","Share","Amount",true)+row("FACCET","30%",usd(t.base*.3),false)+row("S.H.","70%",usd(t.base*.7),false)+'</w:tbl>'+
wp("",false,20);
var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="900" w:right="900" w:bottom="900" w:left="900"/></w:sectPr></w:body></w:document>';
var zip=new JSZip();zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');zip.folder("_rels").file(".rels",'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');zip.folder("word").file("document.xml",doc);var blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="FACCET-Mass-Collection-Summary-"+now.toISOString().slice(0,10)+".docx";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000)}
function exportJPG(){var t=calculate(),names=[];document.querySelectorAll(".collectorName").forEach(function(x){if(x.value.trim())names.push(x.value.trim())});var now=new Date(),scale=2,W=900,H=1180,cv=document.createElement("canvas");cv.width=W*scale;cv.height=H*scale;var x=cv.getContext("2d");x.scale(scale,scale);x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#111";x.textAlign="center";x.font="bold 32px Arial";x.fillText("FACCET Mass Collection Summary",W/2,55);x.font="16px Arial";x.fillStyle="#666";x.fillText(now.toLocaleString(),W/2,85);x.textAlign="left";x.fillStyle="#111";x.font="bold 18px Arial";x.fillText("Collector(s):",55,130);x.font="18px Arial";x.fillText(names.join(", ")||"Not entered",175,130);function line(y){x.strokeStyle="#bbb";x.lineWidth=1;x.beginPath();x.moveTo(55,y);x.lineTo(845,y);x.stroke()}function txt(s,xx,y,bold,align){x.fillStyle="#111";x.font=(bold?"bold ":"")+"18px Arial";x.textAlign=align||"left";x.fillText(s,xx,y)}txt("Cash Collection",55,180,true);x.fillStyle="#eee";x.fillRect(55,200,790,38);txt("Denomination",75,226,true);txt("Count",470,226,true,"center");txt("Amount",820,226,true,"right");var y=238;ds.forEach(function(d){var q=Math.floor(nv("n"+d));y+=48;line(y);txt("$"+d,75,y-16,false);txt(String(q),470,y-16,false,"center");txt(usd(q*d),820,y-16,false,"right")});y+=55;txt("Collection Summary",55,y,true);y+=32;[["Cash Total",usd(t.cash)],["Checks",usd(nv("checks"))],["Coins",usd(nv("coins"))],["TOTAL MONEY",usd(t.all)]].forEach(function(r,i){y+=42;line(y);txt(r[0],75,y-13,i===3);txt(r[1],820,y-13,i===3,"right")});y+=65;txt("Collection Distribution",W/2,y,true,"center");y+=25;x.fillStyle="#eee";x.fillRect(55,y,790,40);txt("Recipient",75,y+27,true);txt("Share",470,y+27,true,"center");txt("Amount",820,y+27,true,"right");[["FACCET","30%",usd(t.base*.3)],["S.H.","70%",usd(t.base*.7)]].forEach(function(r){y+=50;line(y);txt(r[0],75,y+30,true);txt(r[1],470,y+30,false,"center");txt(r[2],820,y+30,true,"right")});cv.toBlob(function(blob){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="FACCET-Mass-Collection-Summary-"+now.toISOString().slice(0,10)+".jpg";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000)},"image/jpeg",0.95)}
calculate();</script></body></html>
